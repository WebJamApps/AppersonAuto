version: 2.1
jobs:
  build:
    docker:
      # Node 24.18 (engines/.nvmrc) — matching browsers image.
      - image: cimg/node:24.18-browsers
    working_directory: ~/repo
    steps:
      - checkout
      - run:
          name: Test install
          command: npm install
      - run:
          name: typecheck
          command: npm run typecheck
      - run:
          name: run all tests
          command: npm test
      - store_artifacts:
          path: coverage
      - run:
          name: Smoketest - clean install without devDependencies
          command: |
            rm -rf node_modules package-lock.json
            npm install --omit=dev
      - run:
          name: Smoketest - verify production server starts
          command: |
            PORT=7777 node server.js &
            SERVER_PID=$!
            sleep 5
            curl --fail --silent --show-error http://localhost:7777/ > /dev/null
            STATUS=$?
            kill $SERVER_PID || true
            exit $STATUS

workflows:
  build-and-test:
    jobs:
      - build
