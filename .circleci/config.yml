version: 2.1
jobs:
  build:
    docker:
      # Node 24.19.0 (engines/.nvmrc) — matching browsers image.
      - image: cimg/node:24.19.0-browsers
    working_directory: ~/repo
    steps:
      - checkout
      - run:
          name: PR base branch verification (main requires dev head)
          command: |
            TARGET="${CIRCLE_TARGET_BRANCH:-${GITHUB_BASE_REF:-}}"
            SOURCE="${CIRCLE_BRANCH:-$(git rev-parse --abbrev-ref HEAD)}"
            if [ -n "$TARGET" ] && [ "$TARGET" = "main" ] && [ "$SOURCE" != "dev" ]; then
              echo "FAIL: PRs targeting main must originate from dev branch (got: $SOURCE)." >&2
              exit 1
            fi
            echo "OK: PR base/head branch verification passed (Target: ${TARGET:-default}, Source: $SOURCE)"
      - run:
          name: Version bump check (PR branches only)
          command: |
            # web-jam-tools#1848 "ci: AppersonAuto, CollegeLutheran, JaMmusic and TimShermanMusic builds fail when package.json is not bumped past dev":
            # a PR branch's package.json version must be strictly greater than origin/dev's.
            # Skipped on dev/main (nothing to diff against itself). Falls back to the actual git
            # branch when CIRCLE_BRANCH is unset so the step can be reproduced locally.
            BRANCH="${CIRCLE_BRANCH:-$(git rev-parse --abbrev-ref HEAD)}"
            if [ "$BRANCH" = "dev" ] || [ "$BRANCH" = "main" ]; then
              echo "On $BRANCH — version-bump check only applies to PR branches, skipping."
              exit 0
            fi
            git fetch --quiet origin dev
            HEAD_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
            DEV_VERSION="$(git show origin/dev:package.json | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")"
            echo "Branch: $BRANCH"
            echo "origin/dev version: $DEV_VERSION"
            echo "HEAD version:       $HEAD_VERSION"
            node -e '
              function parseSemver(v) {
                if (!/^\d+\.\d+\.\d+$/.test(v)) {
                  console.error(`FAIL: invalid semver format: ${v}`);
                  process.exit(1);
                }
                return v.split(".").map(Number);
              }
              const [dev, head] = process.argv.slice(1);
              const d = parseSemver(dev);
              const h = parseSemver(head);
              let cmp = 0;
              for (let i = 0; i < 3 && cmp === 0; i++) cmp = h[i] - d[i];
              if (cmp <= 0) {
                console.error(`FAIL: package.json "version" (${head}) must be strictly greater than origin/dev (${dev}).`);
                console.error(`Next available patch version on origin/dev is ${d[0]}.${d[1]}.${d[2] + 1}.`);
                console.error("Bump the version in package.json (once per PR, on the first commit) before merging.");
                process.exit(1);
              }
              console.log(`OK: version bumped from ${dev} on origin/dev to ${head}`);
            ' "$DEV_VERSION" "$HEAD_VERSION"
      - run:
          name: Test install
          command: npm install
      - run:
          name: typecheck
          command: npm run typecheck
      - run:
          name: run all tests
          command: npm test
      - store_artifacts:
          path: coverage
      - run:
          name: Smoketest - clean install without devDependencies
          command: |
            rm -rf node_modules package-lock.json
            npm install --omit=dev
      - run:
          name: Smoketest - verify production server starts
          command: |
            PORT=7777 node server.js &
            SERVER_PID=$!
            sleep 5
            curl --fail --silent --show-error http://localhost:7777/ > /dev/null
            STATUS=$?
            kill $SERVER_PID || true
            exit $STATUS

workflows:
  build-and-test:
    jobs:
      - build
